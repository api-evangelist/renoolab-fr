summary: >-
  RenooLab publishes no price list on the web. The site states repeatedly that the service is free for both
  sides ("0€ pour créer votre profil", "gratuit, sans commission", "aucune revente de coordonnées") and that
  two optional tradesperson subscriptions, Pro and Premium, exist for extra visibility ("plus de photos,
  priorité dans les résultats", "mise en avant"); the CGU say their prices and conditions "sont présentés dans
  l'application avant toute souscription", managed by the app stores with automatic renewal. The prices are
  therefore not publicly readable and are recorded as null. Agent access (MCP/A2A) is free: the docs state
  the service "est gratuit, sans commission" and that no RenooLab account is required to authorise the
  connector.
