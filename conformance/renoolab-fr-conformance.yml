summary: >-
  RenooLab's conformance profile is the agent-protocol stack, observed live rather than claimed: MCP at
  protocol version 2025-06-18 over streamable HTTP with the MCP Apps UI and Skills extensions, OAuth 2.1
  (authorization code + PKCE S256 + refresh tokens) with RFC 8414 authorization-server metadata, RFC 9728
  protected-resource metadata and RFC 7591 dynamic client registration on the MCP host, an A2A 1.0 agent card
  and JSON-RPC endpoint, an agentskills.io discovery index with sha256-digested archives, an ARD 1.0 federation
  manifest, WebMCP tools registered in-page via document.modelContext, and an llms.txt. It publishes no OpenAPI,
  no OIDC discovery, no RFC 9116 security.txt, no RFC 9727 API catalog, no APIs.json, no RFC 9457 problem
  details and no RFC 8594 sunset signalling. There is no sector interoperability standard for a
  building-trades marketplace to declare; the one identifier scheme in the contract (SIRET, verified against the
  French SIRENE register) is a national business identifier, not a domain data standard, and is recorded
  without claiming a domain-standard signature.
