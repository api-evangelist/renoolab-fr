generated: '2026-09-19'
method: searched
source: https://renoolab.fr/mcp/
sources:
- https://mcp.renoolab.fr/mcp (tools/list annotations, schemas and server instructions, 2026-09-19)
- https://renoolab.fr/mcp/ and https://renoolab.fr/mcp/index.md
