limit_count: 3
summary: >-
  RenooLab publishes quotas on the two WRITE tools, not a requests-per-second ceiling on reads: contacts are
  capped per requester identity (e-mail or phone) over 6 hours with a per-artisan cooldown of 24 hours, and
  profile creation is capped per actor / contact details over 24 hours. The docs describe the enforcement as
  "quotas atomiques et anti-doublon" applied server-side independently of the model, keyed on a pseudonymous
  actor id, the e-mail, the phone and an HMAC of the IP (privacy policy). No rate-limit response headers, no
  status code and no Retry-After behaviour are published; exhaustion surfaces as a tool error whose shape is
  not documented. Read tools carry result caps (5 profiles, 3 complete solutions) and radius caps (30 / 50 km)
  rather than call quotas.
rate_limits:
- name: Contact requests per requester
  scope: per-requester (e-mail or telephone)
  limit: 10
