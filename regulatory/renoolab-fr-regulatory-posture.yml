      quote: 'Selon la fonctionnalité utilisée, des données strictement nécessaires sont traitées par RevenueCat, Apple ou Google pour les achats, Expo puis Apple APNs ou Google FCM pour les notifications, et Brevo pour les e-mails transactionnels.'
  notice_and_action:
    url: https://renoolab.fr/cgu/
    section: '8. Politique de tolérance zéro et modération'
    mechanism: [in-app "Signaler" on any content or account, user blocking (immediate, bidirectional), automatic server-side pre-publication filter on all user content, human moderation]
    stated_sla: 'RenooLab s''engage à examiner les signalements et à prendre les mesures appropriées sous 24 heures'
    actions: [content removal, temporary or permanent account suspension]
    evidence:
