summary: >-
  A French sole-trader marketplace publishing an unusually specific privacy policy. Four signals carry real
  substance: a GDPR data-subject-request process with a channel, a one-month response commitment and the
  CNIL as escalation; data residency stated per store (Supabase eu-west-3 Paris, Cloudflare R2 with EU
  jurisdiction for private documents); a named processor list with purposes inside the dated privacy policy;
  and a DSA-style notice-and-action mechanism (in-app "Signaler", review within 24 hours, block, automatic
  pre-publication filtering) in the CGU. No SBOM, accessibility conformance report, support-lifetime
  statement, GPC statement, incident-notification SLA, age-assurance, transparency report or exit/export
  documentation is published. Retention periods are published in detail (privacy §5) and recorded under
  data_subject_request for context.
signals:
  data_subject_request:
    url: https://renoolab.fr/privacy/
    section: '6. Vos droits'
    channel: support@renoolab.fr, the support page, or in-app account deletion
    stated_sla: 'Nous répondons dans un délai maximal d''un mois.'
    rights_named: [accès, rectification, effacement, portabilité, opposition, limitation du traitement]
    escalation: Commission Nationale de l'Informatique et des Libertés (CNIL), www.cnil.fr
    deletion_page: https://renoolab.fr/suppression-compte/
    deletion_detail: 'in-app deletion is immediate; e-mail deletion requests handled "sous 7 jours ouvrés"; the page lists exactly which data are erased and that authored reviews persist anonymised as "Utilisateur supprimé"'
    retention_published: 'privacy §5 - private messages pseudonymised after 24 months; profile views deleted after 12 months; anti-abuse logs 30 days; assistant funnel logs 12 months; processed agentic contact requests have identifying fields erased after 90 days; never-activated assistant-created accounts deleted from 30 days; refused verification requests 12 months; accounting records up to 10 years'
    evidence:
    - source: https://renoolab.fr/privacy/
      http_status: 200
      fetched: '2026-09-19'
      quote: 'Vous disposez des droits d''accès, rectification, effacement, portabilité, opposition et limitation du traitement. Vous pouvez supprimer votre compte depuis l''application ou exercer vos droits via notre page support ou par e-mail à [support@renoolab.fr]. Nous répondons dans un délai maximal d''un mois. Vous pouvez également saisir la Commission Nationale de l''Informatique et des Libertés (CNIL).'
    note: A section of the privacy policy plus a dedicated account-deletion page, not a request form or API (no /privacy/requests endpoint).
  data_residency:
    url: https://renoolab.fr/privacy/
    section: '4. Hébergement et destinataires'
    regions: [eu]
    detail: 'accounts and application data on Supabase region Paris (eu-west-3); public photos on Cloudflare R2; verification documents in a private Cloudflare R2 bucket "avec juridiction européenne"; site served via Cloudflare Pages (host of record Cloudflare, Inc., San Francisco, per mentions légales); transfers outside the EEA "encadrés par les mécanismes contractuels applicables"'
    evidence:
    - source: https://renoolab.fr/privacy/
      http_status: 200
      fetched: '2026-09-19'
      quote: 'Les comptes et données applicatives sont hébergés sur Supabase en région Paris (eu-west-3). Les photos publiques sont stockées sur Cloudflare R2. Les justificatifs de vérification sont placés dans un bucket Cloudflare R2 privé avec juridiction européenne.'
    - source: https://renoolab.fr/mentions-legales/
      http_status: 200
      fetched: '2026-09-19'
      quote: 'Les données dynamiques (profils artisans, avis, photos) sont stockées sur Supabase (région Paris, France) et Cloudflare R2 (jurisdiction EU).'
    note: A stated hosting region for named data classes, not a selectable residency option; there is one region.
  subprocessors:
    url: https://renoolab.fr/privacy/
    section: '4. Hébergement et destinataires'
    dated: '2026-08-15'
    form: prose list inside the dated privacy policy (no standalone subprocessor page - /legal/subprocessors 404)
    entries:
