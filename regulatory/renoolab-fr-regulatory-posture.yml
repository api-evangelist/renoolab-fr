      http_status: 200
      fetched: '2026-09-19'
      quote: 'Pour un contenu ou un comportement abusif, utilisez en priorité « Signaler » dans l''application afin de joindre l''élément exact.'
    note: An in-product reporting flow with a stated review period, in the terms rather than on a dedicated /legal/report-content page (404). No statement of reasons or appeal process is published.
