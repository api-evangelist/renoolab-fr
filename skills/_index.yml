  is a PROVIDER-PUBLISHED skill set, not a pipeline-generated one: RenooLab authors ten French SKILL.md workflows
  (5 for homeowners, 5 for tradespeople / building businesses) covering 29 internal intents, each shipped as a sha256-digested
  tar.gz under https://renoolab.fr/.well-known/agent-skills/packages/v0.5.5/. All ten archives were fetched 2026-09-19
  (HTTP 200) and every digest matched the index; each was extracted unchanged into skills/<name>/ (SKILL.md, references/*.md,
  agents/openai.yaml). Upstream repository: github.com/mehdimicra/renoolab-agent-skills, Apache-2.0, release v0.5.5
  (2026-08-23), installable with `npx skills add https://github.com/mehdimicra/renoolab-agent-skills` and also packaged
  for Claude Code, Codex, Cursor, Gemini CLI, Kiro, Perplexity (zip) and Microsoft 365 Copilot Cowork (zip).
