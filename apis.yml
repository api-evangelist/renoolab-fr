aid: renoolab-fr
name: RenooLab
description: >-
  RenooLab ("le réseau social de la rénovation") is a French marketplace, published by Marseille-based sole
  trader Mehdi Boukenouche, that connects homeowners with building tradespeople across 19 trades - free for
  both sides, no commission on jobs, no lead reselling; tradespeople can buy optional in-app Pro/Premium
  visibility. Its developer surface is agent-native rather than REST: an official remote MCP server at
  https://mcp.renoolab.fr/mcp (streamable HTTP, protocol 2025-06-18, four tools - two anonymous read-only
  searches by trade/city or multi-trade project, two OAuth 2.1-gated writes for moderated contact requests and
  inactive profile creation, with dynamic client registration and PKCE; on the MCP Registry as fr.renoolab/mcp
  v1.4.0 and in the ChatGPT app directory), a read-only A2A 1.0 agent at https://a2a.renoolab.fr/a2a with its
  card at /.well-known/agent-card.json, ten provider-published Agent Skills discoverable at
  /.well-known/agent-skills/index.json, an ARD / ai-catalog federation manifest, WebMCP tools registered
  in-page via document.modelContext, and an llms.txt. No OpenAPI, SDK or REST reference is published; the
  tools/list contract is the machine-readable core. Deployment is national with the PACA region first.
