- aid: renoolab-fr:renoolab-a2a-agent
  name: RenooLab A2A Agent
  description: >-
    Read-only Agent2Agent surface: an A2A 1.0 JSON-RPC endpoint at https://a2a.renoolab.fr/a2a whose card
    (served at /.well-known/agent-card.json on both renoolab.fr and a2a.renoolab.fr, version 1.0.2) declares one
    skill, find_artisans_france - find building tradespeople in France by trade and city or for a confirmed
    multi-trade project, inferring a trade from a described problem or asking for clarification. It returns
    public profiles and contact options, never contacts a professional and writes no business data; it shares
    the search engine behind the MCP tools. No streaming, push notifications or extended card; anonymous. GET
    /a2a answers 405 and a JSON-RPC envelope without an A2A version answers -32009 "Version A2A invalide" with
    a request_id. Graded conformant against A2A 1.0.0 in a2a/renoolab-fr-a2a.yml.
