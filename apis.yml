apis:
- aid: renoolab-fr:renoolab-mcp-server
  name: RenooLab MCP Server
  description: >-
    Official remote MCP server (streamable HTTP, JSON-RPC 2.0, MCP 2025-06-18, serverInfo renoolab-mcp 1.4.0)
    exposing four French-language tools over the marketplace: rechercher_artisans (one trade within 30 km of a
    commune, up to 5 profiles, attributed Google Maps listings when no member is available) and
    rechercher_chantier (a confirmed multi-trade project within 50 km) are anonymous and read-only;
    contacter_artisan (a moderated contact request to exactly one selected profile or Place ID) and
    creer_profil_artisan (an inactive profile activated by e-mail) require an OAuth 2.1 bearer from the
    provider's own authorization server on the same host (RFC 8414 + RFC 9728 metadata, DCR, PKCE S256, no
    RenooLab account needed). tools/list answers anonymously with full inputSchema, outputSchema, annotations
    and per-tool securitySchemes; MCP Apps UI widgets render results in compatible hosts. Listed on the official
    MCP Registry as fr.renoolab/mcp (v1.4.0, 2026-08-23) with a public metadata repository.
  image: https://renoolab.fr/logo-128.webp
  humanURL: https://renoolab.fr/mcp/
