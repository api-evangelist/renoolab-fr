  auth_detail: >-
    Mixed by tool, declared per tool in _meta.securitySchemes: rechercher_artisans and rechercher_chantier
    are {type: noauth} and answered tools/list anonymously; contacter_artisan and creer_profil_artisan are
    {type: oauth2, scopes: []}. The host publishes RFC 9728 protected-resource metadata and RFC 8414
    authorization-server metadata (issuer https://mcp.renoolab.fr, authorization_code + refresh_token, PKCE
