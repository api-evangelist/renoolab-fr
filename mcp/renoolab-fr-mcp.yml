tools:
- name: rechercher_artisans
  title: Trouver un artisan pour des travaux en France
  effect: read-only
  annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: true}
  auth: noauth
  inputs: [besoin, metier, ville, code_postal, departement, tracking]
  required: []
  output_kinds: [artisan_results, search_needs_input, external_grounded_results]
  ui: ui://widget/artisans-v16.html (MCP Apps widget; openai/outputTemplate)
- name: rechercher_chantier
  title: Trouver les artisans pour un chantier en France
  effect: read-only
  annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}
  auth: noauth
  inputs: [ville, metiers_confirmes, code_postal, departement, tracking]
  required: [ville, metiers_confirmes]
  output_kinds: [chantier_results, search_needs_input]
- name: contacter_artisan
  title: Contacter un professionnel via RenooLab
  effect: write - moderated contact request, explicit user confirmation required
  annotations: {readOnlyHint: false, destructiveHint: true, idempotentHint: false, openWorldHint: false}
  auth: oauth2
  inputs: [artisan_id | external_place_id (exactly one, enforced by oneOf), nom, email, telephone, message]
  required: [nom, email, telephone, message]
  output_kinds: [contact_pending]
- name: creer_profil_artisan
  title: Inscrire un artisan ou une entreprise du bâtiment
  effect: write - creates an inactive profile, activation by e-mail
  annotations: {readOnlyHint: false, destructiveHint: true, idempotentHint: false, openWorldHint: true}
  auth: oauth2
  inputs: [nom_entreprise, siret, metiers, ville, email, telephone, bio]
  required: [nom_entreprise, metiers, ville, email, telephone]
  output_kinds: [signup_created]
