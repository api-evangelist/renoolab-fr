description: >-
  RenooLab operates an official remote MCP server at https://mcp.renoolab.fr/mcp (streamable HTTP, JSON-RPC
  2.0, MCP protocol 2025-06-18) exposing four tools over its French building-tradespeople marketplace: two
  anonymous read-only searches (rechercher_artisans - one trade within 30 km of a commune, up to 5 profiles,
  may return attributed Google Maps listings when no member is available; rechercher_chantier - a confirmed
  multi-trade project within 50 km, complete providers or a minimal combination) and two OAuth 2.1-gated
  writes (contacter_artisan - a moderated contact request to exactly one selected RenooLab profile or
  external Place ID, held for human validation; creer_profil_artisan - an inactive professional profile that
  only the e-mail holder can activate). tools/list answered anonymously with a full JSON Schema draft-07
  inputSchema AND outputSchema per tool, MCP annotations (readOnlyHint / destructiveHint / idempotentHint /
  openWorldHint), execution.taskSupport and per-tool _meta.securitySchemes; the verbatim result is saved
  alongside as renoolab-fr-mcp-tools-list.json and is the provider's machine-readable contract - no OpenAPI
  is published. The server card at /.well-known/mcp.json, the ARD catalog, the MCP Registry listing
  fr.renoolab/mcp v1.4.0 (2026-08-23), the GitHub metadata repo and the live serverInfo (renoolab-mcp
  1.4.0) all agree on the endpoint and the tool set.
