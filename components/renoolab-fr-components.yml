summary: >-
  RenooLab publishes no embeddable component library for third-party sites. What it does ship are two agent-facing
  UI surfaces - an MCP Apps widget rendered inside compatible MCP hosts, and WebMCP tools registered by its own
  pages for agentic browsers - plus its hosted end-user surfaces (web app, iOS and Android apps, a ChatGPT app listing).
components:
- family: mcp-apps-widget
  name: artisans-widget
  uri: ui://widget/artisans-v16.html
  mime_type: text/html;profile=mcp-app
  official: true
  description: >-
    Expandable result cards rendered by MCP Apps-capable hosts (OpenAI outputTemplate) for rechercher_artisans:
    up to three RenooLab photos per profile, a link to the full web-app profile and a contact path. Opening a card
    never triggers the write tool. CSP resource domains are the provider's R2 bucket and lh3.googleusercontent.com;
    redirect domains are app.renoolab.fr, renoolab.fr and Google Maps.
  compat: ui://widget/artisans-v15.html kept as artisans-widget-v15-compat
  loader: MCP Apps extension io.modelcontextprotocol/ui (declared at initialize)
- family: webmcp
  name: RenooLab WebMCP page tools
  script: https://renoolab.fr/webmcp.js
  official: true
  tools:
  - rechercher_artisans_renoolab
  - rechercher_chantier_renoolab
  - contacter_artisan_renoolab
  - inscrire_artisan_renoolab
  description: >-
    First-party script (36 KB, loaded by renoolab.fr pages) that registers four typed tools with document.modelContext
    (falling back to navigator.modelContext) under the Chrome WebMCP origin trial. Its header comment states it
    is a total no-op in browsers without the API, that searches go through the site's same-origin Worker rather
    than mcp.renoolab.fr, and that both write tools require a visible human confirmation in the page before any
    byte is sent. Disabled on /contact-professionnel.
  status: experimental (origin trial); observed signal only in the catalog, not scored
